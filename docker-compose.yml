name: vegah-intern

services:
  web:
    image: ${IMAGE_PREFIX:-vegah-local/vegah}-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks: [app]

  api:
    image: ${IMAGE_PREFIX:-vegah-local/vegah}-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-vegah}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-vegah}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    networks: [app, data]

  worker:
    image: ${IMAGE_PREFIX:-vegah-local/vegah}-worker:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-vegah}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-vegah}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(6379,'redis');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks: [app, data]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vegah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-vegah}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vegah} -d ${POSTGRES_DB:-vegah}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [data]

  proxy:
    image: caddy:2-alpine
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [app]

volumes:
  postgres-data:
  redis-data:

networks:
  app:
  data:
    internal: true
